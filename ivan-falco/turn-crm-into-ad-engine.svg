  </text>

  <!-- Headline line 1 -->
  <text x="750" y="325" text-anchor="middle"
        font-family="'General Sans', 'Inter', 'Helvetica Neue', -apple-system, system-ui, sans-serif"
        font-size="96" font-weight="700" fill="#f4ecdb" letter-spacing="-2">
    Turn Your CRM Into an
  </text>

  <!-- Headline line 2 (accent) -->
  <text x="750" y="440" text-anchor="middle"
        font-family="'General Sans', 'Inter', 'Helvetica Neue', -apple-system, system-ui, sans-serif"
        font-size="96" font-weight="700" fill="#ff5a1f" letter-spacing="-2">
