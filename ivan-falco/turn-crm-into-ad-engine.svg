      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#ff5a1f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#1e2530" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="600" fill="#0d1117"/>
  <rect width="1500" height="600" fill="url(#grid)"/>
  <rect width="1500" height="600" fill="url(#glow)"/>

  <!-- Kicker -->
